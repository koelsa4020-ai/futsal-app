<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>풋살팀 매니저</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 동네 풋살팀 단톡방 옆에 붙여둔 실내 경기장 전광판 — 빠르고, 크고, 손가락 하나로.
   IDEA: 실내 풋살 코트 + 경기장 스코어보드. 헤더는 코트 라인, 경기 화면은 전광판.
   PICTURE: 경기 탭의 대형 스코어보드(팀 조끼 색, 점수, 카운트다운)가 앱의 중심.
   COLOUR and TYPE: 코트 블루 바탕 헤더 + 오렌지 공 액센트, 팀은 조끼 색. Black Han Sans 제목, Barlow Condensed 숫자, Noto Sans KR 본문.
   LAYOUT: 휴대폰 한 손 조작 우선. 하단 탭 6개, 한 열 카드, 720px 넘으면 가운데 정렬. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0a1226);--ink:light-dark(#0d1326,#e9edf7);--mute:light-dark(#5b6478,#9aa5bd);
--line:light-dark(#e3e7ef,#1f2b47);--card:light-dark(#ffffff,#101a33);--soft:light-dark(#f2f5fb,#14203d);
--court:#123a8c;--court2:#1a4fb5;--acc:#ff6a13;--yes:#1d9a5b;--no:#d63a3a;--hold:#e0a100}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
.top{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--court2),var(--court));color:#fff;padding:22px max(5vw,16px) 20px}
.top svg{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}
.top .in{position:relative;max-width:720px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font:400 clamp(28px,7vw,40px)/1.05 "Black Han Sans",sans-serif;margin:0;text-wrap:balance}
.top p{margin:4px 0 0;opacity:.85;font-size:14px}
.me{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;min-height:44px;color:#fff;cursor:pointer;white-space:nowrap}
.me b{color:#ffd2b8}
main{max-width:720px;margin:0 auto;padding:16px max(4vw,14px) 24px}
.note{max-width:720px;margin:10px auto 0;padding:0 max(4vw,14px)}
.note div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--mute)}
h2{font:400 22px/1.2 "Black Han Sans",sans-serif;margin:22px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 140px}
.mute{color:var(--mute);font-size:14px}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:0 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.blue{background:var(--court2);border-color:var(--court2);color:#fff}
.btn.ghost{background:transparent}
.btn.warn{color:var(--no)}
.btn.armed{background:var(--no);border-color:var(--no);color:#fff}
.btn.big{min-height:56px;font-size:18px;flex:1 1 0}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text],input[type=date],input[type=number],select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;min-height:40px;min-width:52px;padding:0 10px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button:disabled{opacity:.35;cursor:not-allowed}.seg .on.yes{background:var(--yes);color:#fff}.seg .on.no{background:var(--no);color:#fff}.seg .on.hold{background:var(--hold);color:#1a1200}
.myvote .btn.on.yes{background:var(--yes);border-color:var(--yes);color:#fff}
.myvote .btn.on.no{background:var(--no);border-color:var(--no);color:#fff}
.myvote .btn.on.hold{background:var(--hold);border-color:var(--hold);color:#1a1200}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list li:first-child{border-top:0}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.counts div{background:var(--soft);border-radius:10px;padding:8px 4px}
.counts b{display:block;font:700 28px/1 "Barlow Condensed",sans-serif}
.counts span{font-size:13px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;background:var(--soft);font-size:14px;border:1px solid var(--line);cursor:pointer;min-height:34px}
.chip.g{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--tc);border:1px solid rgba(0,0,0,.25);flex:none}
.team{border-top:6px solid var(--tc)}
.team h3{display:flex;justify-content:space-between}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
.t-pro{background:#ff6a13;color:#fff}.t-semi{background:#2a6cff;color:#fff}.t-ama{background:#0f9d8a;color:#fff}.t-beg{background:#8a93a6;color:#fff}.t-none{background:var(--soft);color:var(--mute);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
.board{background:#081634;color:#fff;border-radius:18px;padding:18px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;box-shadow:inset 0 0 0 3px #1a2c57}
.side{text-align:center}
.side .nm{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.side .sc{font:700 clamp(64px,18vw,104px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.clock{font:700 clamp(30px,8vw,44px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;background:#000;color:#ffb37f;border-radius:10px;padding:8px 12px;text-align:center}
.clock small{display:block;font:500 12px/1.4 "Noto Sans KR",sans-serif;color:#9fb0d6}
.clock.over{color:#ff4d4d}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 120px}
.goalbtn{background:var(--tc);border-color:var(--tc);color:var(--tx);font-weight:700}
.ev{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ev .min{font:700 18px "Barlow Condensed",sans-serif;width:38px;flex:none;color:var(--acc)}
.res{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.res .s{font:700 34px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.res .w{color:var(--acc)}
.mvp{margin-top:8px;font-size:14px;background:var(--soft);border-radius:8px;padding:8px 10px}
.mvp b{color:var(--acc)}
.rank li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}
.rank .no{font:700 24px "Barlow Condensed",sans-serif;color:var(--mute);text-align:center}
.rank .top3 .no{color:var(--acc)}
.rank .v{font:700 26px/1 "Barlow Condensed",sans-serif;text-align:right;white-space:nowrap}
.rank .sub{font-size:13px;color:var(--mute)}
.sorts{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.sorts button{flex:none}
.sorts .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:28px 14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{border:0;background:none;min-height:60px;font-size:13px;cursor:pointer;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs .on{color:var(--acc);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pick .btn{text-align:left}
.rate{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rate input{grid-column:1/-1;width:100%;accent-color:var(--acc);height:32px}
.rate output{font:700 24px "Barlow Condensed",sans-serif;text-align:right;color:var(--acc)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.clock.run{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,106,19,.25)}}}
@media(max-width:600px){table{font-size:13px}.tabs button{font-size:12px}}
</style>
</head>
<body>
<header class="top">
  <svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#fff" stroke-width="2"><rect x="6" y="6" width="388" height="108" rx="2"/><line x1="200" y1="6" x2="200" y2="114"/><circle cx="200" cy="60" r="26"/><path d="M6 24 a42 42 0 0 1 0 72"/><path d="M394 24 a42 42 0 0 0 0 72"/></g>
  </svg>
  <div class="in">
    <div><h1 id="teamTitle">우리 풋살팀</h1><p id="subTitle">불러오는 중…</p></div>
    <button class="me" id="meBtn" type="button">나: <b>선택하기</b></button>
  </div>
</header>
<div class="note" id="note"></div>
<main id="app"><div class="empty mute">데이터를 불러오는 중이에요…</div></main>
<nav class="tabs" id="tabs">
  <button data-tab="vote" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg>투표</button>
  <button data-tab="teams" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 3-5 6-5s6 2 6 5M12 20c0-3 2-5 4-5s6 2 6 5"/></svg>팀짜기</button>
  <button data-tab="match" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg>경기</button>
  <button data-tab="rate" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>평가</button>
  <button data-tab="rank" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V12M10 20V6M16 20v-9M22 20H2"/></svg>랭킹</button>
  <button data-tab="members" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>멤버</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const COLS=['players','weeks','votes','matches','ratings','settings'];
const S={players:[],weeks:[],votes:[],matches:[],ratings:[],settings:[]};
const TEAMS=[{name:'A팀',c:'#ff6a13'},{name:'B팀',c:'#2a6cff'},{name:'C팀',c:'#c6e600'},{name:'D팀',c:'#f2f2f2'}];
const txOn=c=>['#c6e600','#f2f2f2'].includes(c)?'#111':'#fff';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ui={tab:ls.get('futsal.tab')||'vote',week:null,teamCount:2,balance:false,min:12,sort:'tier',armed:null,newWeek:false};
let me=ls.get('futsal.me');
let store=null,mode='loading';const loaded=new Set();let slowNote='';

/* ---------- storage ---------- */
function localStore(){
  const key='futsal.local.v1';let data={};try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){}
  const subs={};const save=()=>ls.set(key,JSON.stringify(data));
  const emit=c=>subs[c]&&subs[c](Object.entries(data[c]||{}).map(([id,d])=>({id,...d})),{fromCache:false});
  return{sub(c,cb){subs[c]=cb;emit(c)},
    async set(c,id,d){(data[c]=data[c]||{})[id]=d;save();emit(c)},
    async del(c,id){if(data[c])delete data[c][id];save();emit(c)}};
}
function remoteStore(db){
  return{sub(c,cb,err){return db.collection(c).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()})),s.metadata),err)},
    set:(c,id,d)=>db.collection(c).doc(id).set(d),
    del:(c,id)=>db.collection(c).doc(id).delete()};
}
const q={};
function queue(key,fn){q[key]=(q[key]||Promise.resolve()).then(fn).catch(e=>{toast('저장하지 못했어요'+(e&&e.code==='invalid_argument'?' (편집 권한이 필요해요)':''))});return q[key]}
function save(c,obj){const{id,...d}=obj;const i=S[c].findIndex(x=>x.id===id);if(i>=0)S[c][i]={id,...d};else S[c].push({id,...d});render();return queue(c+'/'+id,()=>store.set(c,id,JSON.parse(JSON.stringify(d))))}
function remove(c,id){S[c]=S[c].filter(x=>x.id!==id);render();return queue(c+'/'+id,()=>store.del(c,id))}

/* ---------- helpers ---------- */
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function fmtDate(s){const d=new Date(s+'T00:00:00');if(isNaN(d))return s;return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')'}
const weeks=()=>[...S.weeks].sort((a,b)=>b.id.localeCompare(a.id));
const curWeek=()=>{const ws=weeks();return ws.find(w=>w.id===ui.week)||ws[0]||null};
const P=id=>S.players.find(p=>p.id===id);
function guestOf(id){for(const w of S.weeks){const g=(w.guests||[]).find(g=>g.id===id);if(g)return g}return null}
const nameOf=id=>P(id)?.name||guestOf(id)?.name||'(삭제된 선수)';
const isGuest=id=>!P(id)&&!!guestOf(id);
const teamDoc=()=>S.settings.find(x=>x.id==='team')||{id:'team'};
const mgrs=()=>teamDoc().managers||[];
const isMgr=()=>!!(me&&P(me)&&mgrs().includes(me));
const canVote=pid=>isMgr()||(!!me&&pid===me);
const voteOf=(wid,pid)=>S.votes.find(v=>v.id===wid+'__'+pid)?.status||null;
const attendees=w=>[...S.players.filter(p=>voteOf(w.id,p.id)==='yes').map(p=>p.id),...(w.guests||[]).map(g=>g.id)];
const score=m=>({a:(m.events||[]).filter(e=>e.team==='a').length,b:(m.events||[]).filter(e=>e.team==='b').length});
const elapsed=m=>Math.max(0,((m.pausedAt||Date.now())-m.startedAt-(m.pausedTotal||0))/1000);
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function arm(key){if(ui.armed===key){ui.armed=null;return true}ui.armed=key;render();clearTimeout(arm.t);arm.t=setTimeout(()=>{ui.armed=null;render()},3000);return false}
const armBtn=(key,label,cls='')=>`<button class="btn ${ui.armed===key?'armed':cls}" data-act="${key.split(':')[0]}" data-k="${esc(key)}" type="button">${ui.armed===key?'한 번 더 누르면 실행':label}</button>`;

/* ---------- ratings, MVP, tiers ---------- */
function matchRatings(m){const rs=S.ratings.filter(r=>r.match===m.id);const agg={};
  rs.forEach(r=>Object.entries(r.scores||{}).forEach(([pid,v])=>{v=+v;if(pid===r.rater||!(v>=1&&v<=10))return;(agg[pid]=agg[pid]||[]).push(v)}));
  const avg={};for(const k in agg)avg[k]=agg[k].reduce((a,b)=>a+b,0)/agg[k].length;return{avg,raters:rs.length}}
function goalsIn(m,pid){return(m.events||[]).filter(e=>!e.og&&e.scorer===pid).length}
function mvps(m,R){const out={};for(const s of['a','b']){let best=null;
  for(const pid of m[s].members){const v=R.avg[pid];if(v==null)continue;
    if(!best||v>best.v||(v===best.v&&goalsIn(m,pid)>goalsIn(m,best.pid)))best={pid,v}}out[s]=best}return out}
const TIER_G=[['비기너','t-beg'],['아마추어','t-ama'],['세미프로','t-semi'],['프로','t-pro']];
function tierFromAvg(avg){const i=Math.min(11,Math.max(0,Math.floor((avg-1)/0.75)));const[g,cls]=TIER_G[Math.floor(i/3)];return{label:g+' '+(3-i%3),cls,avg}}
const tierTag=t=>t?`<span class="tag ${t.cls}">${esc(t.label)}</span>`:'<span class="tag t-none">배치 전</span>';
let ST={};
function computeStats(){
  const done=S.matches.filter(m=>m.status==='done').sort((a,b)=>(b.endedAt||0)-(a.endedAt||0));
  const st={};const get=id=>st[id]=st[id]||{g:0,a:0,w:0,d:0,l:0,mvp:0,hist:[],played:0};
  done.forEach(m=>{const R=matchRatings(m);const sc=score(m);const mv=mvps(m,R);
    (m.events||[]).forEach(e=>{if(!e.og&&e.scorer)get(e.scorer).g++;if(e.assist)get(e.assist).a++});
    for(const s of['a','b']){const o=s==='a'?'b':'a';m[s].members.forEach(pid=>{const p=get(pid);p.played++;
      if(sc[s]>sc[o])p.w++;else if(sc[s]<sc[o])p.l++;else p.d++;
      if(R.avg[pid]!=null)p.hist.push(R.avg[pid])});if(mv[s])get(mv[s].pid).mvp++}});
  const nW=S.weeks.length;
  for(const p of S.players){const x=get(p.id);const yes=S.weeks.filter(w=>voteOf(w.id,p.id)==='yes').length;
    x.yes=yes;x.att=nW?yes/nW:0;const h=x.hist.slice(0,5);x.tier=h.length?tierFromAvg(h.reduce((a,b)=>a+b,0)/h.length):null;x.tierN=h.length}
  ST=st;
}

/* ---------- views ---------- */
function empty(t,d,tab){return`<div class="card empty"><h3>${t}</h3><p class="mute">${d}</p>${tab?`<button class="btn pri" data-act="go" data-tab="${tab}" type="button">이동하기</button>`:''}</div>`}
function weekBar(w){
  const ws=weeks();
  return`<div class="row" style="margin-bottom:12px">

function teamCard(t,i,movable){

}
function standings(w){
  const ms=S.matches.filter(m=>m.week===w.id&&m.status==='done');if(!ms.length||!(w.teams||[]).length)return'';
  const t=(w.teams||[]).map(x=>({name:x.name,color:x.color,w:0,d:0,l:0,gf:0,ga:0}));
  ms.forEach(m=>{const sc=score(m);[['a','b'],['b','a']].forEach(([s,o])=>{const r=t[m[s].i];if(!r)return;r.gf+=sc[s];r.ga+=sc[o];if(sc[s]>sc[o])r.w++;else if(sc[s]<sc[o])r.l++;else r.d++})});
  t.forEach(r=>r.pts=r.w*3+r.d);const rows=[...t].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));

}
function vTeams(){

function resultCard(m){

function tick(){document.querySelectorAll('[data-clock]').forEach(el=>{const m=S.matches.find(x=>x.id===el.dataset.clock);if(!m)return;
  const rem=m.minutes*60-elapsed(m);el.classList.toggle('over',rem<0);
  el.innerHTML=(rem<0?'+'+mmss(-rem):mmss(rem))+'<small>'+(m.pausedAt?'일시정지':rem<0?'추가 시간':'남은 시간')+'</small>'})}
setInterval(tick,1000);

const sheet=$('#sheet'),panel=$('#panel');let sh=null;

function drawSheet(){
  if(!sh)return;
  if(sh.type==='me'){panel.innerHTML=`<h2>나는 누구인가요?</h2>${S.players.length?`<div class="pick">${S.players.map(p=>`<button class="btn${p.id===me?' pri':''}" data-act="setMe" data-pid="${esc(p.id)}" type="button">${esc(p.name)}</button>`).join('')}</div>`:'<p class="mute">멤버 탭에서 먼저 팀원을 추가해 주세요.</p>'}<button class="btn ghost" style="margin-top:12px;width:100%" data-act="close" type="button">닫기</button>`;return}
  if(sh.type==='goal'){const m=S.matches.find(x=>x.id===sh.mid);if(!m){closeSheet();return}
    const side=sh.side,opp=side==='a'?'b':'a';let body='';
    if(sh.step==='scorer'){body=`<h2>${esc(m[side].name)} 골! 누가 넣었나요?</h2><div class="pick">${m[side].members.map(pid=>`<button class="btn" data-act="gScorer" data-pid="${esc(pid)}" type="button">${esc(nameOf(pid))}</button>`).join('')}</div>
      <h3 style="margin-top:16px">상대 자책골</h3><div class="pick">${m[opp].members.map(pid=>`<button class="btn ghost" data-act="gOg" data-pid="${esc(pid)}" type="button">${esc(nameOf(pid))}</button>`).join('')}</div>`}
    else{body=`<h2>어시스트는 누구?</h2><p class="mute">득점: ${esc(nameOf(sh.scorer))}</p><div class="pick"><button class="btn pri" data-act="gAssist" data-pid="" type="button">어시스트 없음</button>${m[side].members.filter(p=>p!==sh.scorer).map(pid=>`<button class="btn" data-act="gAssist" data-pid="${esc(pid)}" type="button">${esc(nameOf(pid))}</button>`).join('')}</div>`}
    panel.innerHTML=body+`<button class="btn ghost" style="margin-top:12px;width:100%" data-act="close" type="button">취소</button>`;return}
  if(sh.type==='rate'){const m=S.matches.find(x=>x.id===sh.mid);if(!m){closeSheet();return}
    const mySide=m.a.members.includes(me)?'a':'b',opp=mySide==='a'?'b':'a';
    const grp=(s,label)=>`<h3 style="margin-top:14px">${label} · ${esc(m[s].name)}</h3>${m[s].members.filter(p=>p!==me).map(pid=>`<div class="rate"><label for="r_${esc(pid)}">${esc(nameOf(pid))}${isGuest(pid)?' <span class="mute">용병</span>':''}</label><output id="o_${esc(pid)}">${sh.draft[pid]}</output><input type="range" min="1" max="10" step="1" id="r_${esc(pid)}" data-pid="${esc(pid)}" value="${sh.draft[pid]}"></div>`).join('')||'<p class="mute">평가할 선수가 없어요.</p>'}`;
    panel.innerHTML=`<h2>경기 평가</h2><p class="mute">${esc(m.a.name)} ${score(m).a} : ${score(m).b} ${esc(m.b.name)} · 1점(아쉬움) ~ 10점(최고)</p>${grp(mySide,'우리 팀')}${grp(opp,'상대 팀')}
    <div class="btnrow"><button class="btn ghost" data-act="close" type="button">취소</button><button class="btn pri" data-act="rateSave" type="button">평가 저장</button></div>`}
}
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
panel.addEventListener('input',e=>{const r=e.target.closest('input[type=range]');if(!r||!sh||sh.type!=='rate')return;sh.draft[r.dataset.pid]=+r.value;const o=document.getElementById('o_'+r.dataset.pid);if(o)o.textContent=r.value});

/* ---------- actions ---------- */
function liveMatch(){const w=curWeek();return w&&S.matches.find(m=>m.week===w.id&&m.status==='live')}
const A={
  go:b=>{ui.tab=b.dataset.tab;ls.set('futsal.tab',ui.tab);render();scrollTo(0,0)},
  pickMe:()=>openSheet({type:'me'}),
  setMe:b=>{me=b.dataset.pid;ls.set('futsal.me',me);closeSheet();render();toast(nameOf(me)+'님으로 설정했어요')},
  close:closeSheet,
  toggleNewWeek:()=>{ui.newWeek=!ui.newWeek;render()},
  createWeek:()=>{const d=$('#newWeekDate').value;if(!d)return toast('날짜를 선택해 주세요');if(S.weeks.some(w=>w.id===d)){ui.week=d;ui.newWeek=false;render();return toast('이미 있는 일정이라 그 일정으로 이동했어요')}
    ui.week=d;ui.newWeek=false;save('weeks',{id:d,guests:[],teams:[],createdAt:Date.now()})},
  delWeek:b=>{if(!arm(b.dataset.k))return;const w=curWeek();if(!w)return;S.votes.filter(v=>v.id.startsWith(w.id+'__')).forEach(v=>remove('votes',v.id));ui.week=null;remove('weeks',w.id)},
  vote:b=>{const w=curWeek();if(!w)return;if(!canVote(b.dataset.pid))return toast('본인과 매니저만 바꿀 수 있어요');const id=w.id+'__'+b.dataset.pid;if(voteOf(w.id,b.dataset.pid)===b.dataset.s)return;save('votes',{id,week:w.id,pid:b.dataset.pid,status:b.dataset.s,at:Date.now()})},
  addGuest:()=>{const w=curWeek();const n=$('#guestName').value.trim();if(!n)return toast('용병 이름을 입력해 주세요');$('#guestName').value='';save('weeks',{...w,guests:[...(w.guests||[]),{id:'g'+uid(),name:n}]})},
  rmGuest:b=>{const w=curWeek();save('weeks',{...w,guests:(w.guests||[]).filter(g=>g.id!==b.dataset.gid),teams:(w.teams||[]).map(t=>({...t,members:t.members.filter(p=>p!==b.dataset.gid)}))})},
  tc:b=>{ui.teamCount=+b.dataset.n;render()},
  draw:b=>{const w=curWeek();if((w.teams||[]).length&&!arm(b.dataset.k))return;ui.armed=null;
    const n=ui.teamCount;let arr=attendees(w).map(id=>({id,r:Math.random()}));arr.sort((x,y)=>x.r-y.r);
    if(ui.balance)arr=arr.map(x=>({id:x.id,s:(ST[x.id]?.tier?.avg??5.5)+Math.random()*0.6})).sort((x,y)=>y.s-x.s);
    const teams=TEAMS.slice(0,n).map(t=>({name:t.name,color:t.c,members:[]}));
    arr.forEach((x,i)=>{const r=Math.floor(i/n),k=i%n;teams[ui.balance&&r%2?n-1-k:k].members.push(x.id)});
    save('weeks',{...w,teams});toast(n+'팀으로 짰어요')},
  move:b=>{const w=curWeek();const t=+b.dataset.t,n=w.teams.length;const teams=w.teams.map((x,i)=>({...x,members:i===t?x.members.filter(p=>p!==b.dataset.pid):x.members.slice()}));teams[(t+1)%n].members.push(b.dataset.pid);save('weeks',{...w,teams})},
  start:()=>{const w=curWeek();const ia=+$('#mA').value,ib=+$('#mB').value,min=Math.max(1,Math.min(90,+$('#mMin').value||12));
    if(ia===ib)return toast('서로 다른 두 팀을 골라 주세요');ui.min=min;const T=i=>({i,name:w.teams[i].name,color:w.teams[i].color,members:w.teams[i].members.slice()});
    save('matches',{id:'m'+uid(),week:w.id,a:T(ia),b:T(ib),minutes:min,status:'live',startedAt:Date.now(),pausedTotal:0,pausedAt:null,events:[],createdAt:Date.now()})},
  pause:()=>{const m=liveMatch();if(!m)return;const now=Date.now();save('matches',m.pausedAt?{...m,pausedTotal:(m.pausedTotal||0)+now-m.pausedAt,pausedAt:null}:{...m,pausedAt:now})},
  endMatch:b=>{if(!arm(b.dataset.k))return;const m=liveMatch();if(!m)return;const sc=score(m);
    save('matches',{...m,status:'done',endedAt:Date.now(),pausedAt:m.pausedAt||Date.now(),scoreA:sc.a,scoreB:sc.b});toast('경기 종료! 평가 탭에서 선수들을 평가해 주세요')},
  delMatch:b=>{if(!arm(b.dataset.k))return;const id=b.dataset.k.split(':')[1];S.ratings.filter(r=>r.match===id).forEach(r=>remove('ratings',r.id));remove('matches',id)},
  goal:b=>{const m=liveMatch();if(m)openSheet({type:'goal',mid:m.id,side:b.dataset.s,step:'scorer'})},
  gScorer:b=>{sh.scorer=b.dataset.pid;sh.step='assist';drawSheet()},
  gAssist:b=>addEvent({scorer:sh.scorer,assist:b.dataset.pid||null,og:false}),
  gOg:b=>addEvent({scorer:b.dataset.pid,assist:null,og:true}),
  rmEv:b=>{const m=liveMatch();if(m)save('matches',{...m,events:(m.events||[]).filter(e=>e.id!==b.dataset.id)})},
  rateOpen:b=>{const m=S.matches.find(x=>x.id===b.dataset.id);const ex=S.ratings.find(r=>r.id===m.id+'__'+me);const draft={};
    [...m.a.members,...m.b.members].forEach(pid=>{if(pid!==me)draft[pid]=ex?.scores?.[pid]??5});openSheet({type:'rate',mid:m.id,draft})},
  rateSave:()=>{const id=sh.mid+'__'+me;save('ratings',{id,match:sh.mid,rater:me,scores:{...sh.draft},at:Date.now()});closeSheet();toast('평가를 저장했어요')},
  sort:b=>{ui.sort=b.dataset.k;render()},
  saveTeam:()=>{save('settings',{...teamDoc(),name:$('#teamName').value.trim()||'우리 풋살팀'});toast('팀 이름을 저장했어요')},
  addPlayer:()=>{const n=$('#newName').value.trim();if(!n)return toast('이름을 입력해 주세요');if(S.players.some(p=>p.name===n))return toast('같은 이름이 이미 있어요');$('#newName').value='';save('players',{id:'p'+uid(),name:n,createdAt:Date.now()})},
  toggleMgr:b=>{const ms=mgrs();if(ms.length&&!isMgr())return toast('매니저만 바꿀 수 있어요');const id=b.dataset.pid;
    const next=ms.includes(id)?ms.filter(x=>x!==id):[...ms,id];if(ms.length&&!next.length)return toast('매니저는 최소 한 명 있어야 해요');save('settings',{...teamDoc(),managers:next})},
  delPlayer:b=>{if(!arm(b.dataset.k))return;const id=b.dataset.k.split(':')[1];if(id===me){me=null;ls.set('futsal.me','')}remove('players',id)}
};
function addEvent(x){const side=sh.side;const m=S.matches.find(y=>y.id===sh.mid);closeSheet();if(!m||m.status!=='live')return;
  save('matches',{...m,events:[...(m.events||[]),{id:'e'+uid(),team:side,sec:Math.floor(elapsed(m)),...x}]});toast(x.og?'자책골 기록':'골 기록: '+nameOf(x.scorer))}
function onClick(e){const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b)}
document.addEventListener('click',e=>{if(e.target.closest('#tabs')){const b=e.target.closest('[data-tab]');if(b)A.go(b);return}if(e.target.closest('#meBtn'))return A.pickMe();if(e.target.closest('#app,#panel'))onClick(e)});
document.addEventListener('change',e=>{if(e.target.id==='weekSel'){ui.week=e.target.value;render()}if(e.target.id==='balance')ui.balance=e.target.checked});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const m={guestName:'addGuest',newName:'addPlayer',teamName:'saveTeam'}[e.target.id];if(m)A[m]()}if(e.key==='Escape')closeSheet()});

/* ---------- boot ---------- */
render();
(async()=>{
  let db=null;try{db=typeof claude!=='undefined'&&claude.use?await claude.use('db'):null}catch(e){db=null}
  store=db?remoteStore(db):localStore();mode=db?'remote':'local';
  const timer=setTimeout(()=>{if(loaded.size<COLS.length){slowNote='데이터를 아직 불러오지 못했어요. 표시된 내용이 최신이 아닐 수 있어요.';render()}},10000);
  COLS.forEach(c=>store.sub(c,(rows,meta)=>{S[c]=rows;if(!meta||!meta.fromCache)loaded.add(c);if(loaded.size===COLS.length){clearTimeout(timer);slowNote=''}
    if(!sh||sh.type!=='rate')drawSheet();render()},err=>{clearTimeout(timer);slowNote='데이터 연결이 끊겼어요. 페이지를 다시 열어 주세요.';render()}));
  render();
})();
}
</script>
</body>
</html>
