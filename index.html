<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>풋살팀 매니저</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 동네 풋살팀 전용 매칭앱 — 밝고 단정하게, 한 손으로 빠르게.
   IDEA: 스포츠 매칭앱의 카드 리스트. 팀원은 우리 유니폼(홈 파랑/원정 주황)을 입은 캐릭터로 표시.
   PICTURE: 투표 카드의 내 캐릭터와 참석 막대, 경기 탭의 스코어보드.
   COLOUR and TYPE: 회색빛 바탕 위 흰 카드, 파랑 #1570ff 하나로 강조. Noto Sans KR 900 제목, Barlow Condensed 숫자.
   LAYOUT: 흰 헤더 + 날짜 탭, 한 열 카드, 하단 탭. 720px 넘으면 가운데 정렬. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6fa,#0b1220);--ink:light-dark(#111827,#e8ecf4);--mute:light-dark(#6b7280,#9aa4b6);
--line:light-dark(#eceff4,#1f2a40);--card:light-dark(#ffffff,#121b2e);--soft:light-dark(#f1f3f7,#18233a);
--acc:#1570ff;--accSoft:light-dark(#e8efff,#16264a);--yes:#1570ff;--no:#dc2626;--hold:#f59e0b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
.top{background:var(--card);color:var(--ink);padding:12px max(4vw,14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;object-fit:contain;flex:none}
.gate::before{content:"";display:block;width:72px;height:72px;margin:0 auto 6px;background:url(logo.png) center/contain no-repeat}
.top h1{font:900 20px/1.2 "Noto Sans KR",sans-serif;margin:0;letter-spacing:-.4px}
.top p{margin:0;font-size:12px;color:var(--mute)}
.me{width:44px;height:44px;padding:0;border-radius:50%;border:0;background:var(--soft);cursor:pointer;overflow:hidden;flex:none;font-weight:700;color:var(--acc)}
.av{display:inline-block;flex:none;border-radius:50%;overflow:hidden;vertical-align:middle;line-height:0}
.av svg{width:100%;height:100%}
.weeks{display:flex;gap:4px;overflow-x:auto;margin:-16px calc(-1 * max(4vw,14px)) 14px;padding:0 max(4vw,14px);background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
.weeks button{flex:none;border:0;background:none;min-height:46px;padding:0 10px;font-size:15px;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.weeks button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.weeks .add{color:var(--acc);font-weight:700}
.hero .ttl{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.25}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;margin-right:4px;background:var(--accSoft);color:var(--acc)}
.badge.past{background:var(--soft);color:var(--mute)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;display:flex;margin:14px 0}
.bar i{display:block;background:var(--yes)}.bar i.h{background:var(--hold)}
.vote3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vote3 .btn{min-height:52px;font-size:16px;font-weight:700;background:var(--card)}
.vote3 .btn.on.yes{background:var(--yes);border-color:var(--yes);color:#fff}
.vote3 .btn.on.no{background:var(--no);border-color:var(--no);color:#fff}
.vote3 .btn.on.hold{background:var(--hold);border-color:var(--hold);color:#1a1200}
.pill{font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;white-space:nowrap}
.p-yes{background:var(--accSoft);color:var(--acc)}.p-no{background:light-dark(#fde8e8,#3a1717);color:light-dark(#b91c1c,#fca5a5)}.p-hold{background:light-dark(#fff6db,#3a2e10);color:light-dark(#a16207,#fcd34d)}.p-none{background:var(--soft);color:var(--mute)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .who{flex:1;min-width:0}
.prow .who b{font-weight:700}
.prow .sub{font-size:12px;color:var(--mute)}
.lhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.lhead h2{margin:0}
.r-pres{background:#111827;color:#fff}
[data-drag]{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.dz{transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.dz.over{background:var(--accSoft)!important;outline-color:var(--acc)}
.chip.dragging{opacity:.3}
.steps{display:flex;gap:4px;margin:8px 0 4px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--soft)}.steps i.on{background:var(--acc)}
.wz-k{font-size:13px;font-weight:700;color:var(--acc);margin-top:14px}.wz-t{font:900 30px/1.15 "Noto Sans KR",sans-serif;letter-spacing:-.6px;margin:2px 0 4px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.pbtn{border:0;background:var(--soft);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;font-size:14px}
.pbtn.on{background:var(--accSoft);color:var(--acc);font-weight:700}.pbtn.on .av{box-shadow:0 0 0 3px var(--acc)}
.pbtn.on::after{content:"✓";position:absolute;top:6px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.cmt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.cmt textarea{flex:1;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:16px;background:var(--bg);resize:vertical}
.radar text{font:700 13px "Noto Sans KR",sans-serif}
.bestg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bestg div{background:var(--soft);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px}
.bestg .k{font-size:12px;font-weight:700;color:var(--acc)}
.quote{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:8px}.quote p{margin:0 0 4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border-radius:14px;padding:12px 4px;text-align:center}
.stats b{display:block;font:700 24px/1.15 "Barlow Condensed",sans-serif;white-space:nowrap}.stats span{font-size:12px;color:var(--mute)}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.mrow:first-child{border-top:0}
.mrow .d{width:64px;flex:none;font-size:14px;color:var(--mute)}
.barw{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.barw i{display:block;height:100%;background:var(--acc)}
details.plain{margin:18px 0}details.plain>summary{min-height:48px;justify-content:center;background:var(--card);border-radius:14px;font-weight:700;color:var(--ink)}
.weeks .past{color:var(--mute);font-weight:500}
.lk{margin-top:12px}.lk-t{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.lk-o{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.lkb{flex:none;border:2px solid transparent;border-radius:50%;padding:2px;background:none;cursor:pointer;min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center}
.lkb.on{border-color:var(--acc)}
.lkb.txt{border-radius:12px;border:1px solid light-dark(#dfe3ea,#2a3650);padding:0 14px;font-size:14px}.lkb.txt.on{border:2px solid var(--acc);color:var(--acc);font-weight:700}
.sw{display:block;width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.lk-prev{display:flex;align-items:center;gap:16px}
.dz,.dz *{-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-60%) scale(1.08);box-shadow:0 10px 24px rgba(0,0,0,.22);background:var(--card)!important}
.card.pool{border:2px dashed light-dark(#cfd6e2,#2d3a55);background:transparent}
.pool .hint{font-size:13px;color:var(--mute);margin:0}
.chip .out{font-size:11px;font-weight:700;color:var(--no);margin-left:2px}.r-mgr{background:var(--accSoft);color:var(--acc)}
.me b{color:#ffd2b8}
main{max-width:720px;margin:0 auto;padding:16px max(4vw,14px) 24px}
.note{max-width:720px;margin:10px auto 0;padding:0 max(4vw,14px)}
.note:empty{display:none}.note div+div{margin-top:6px}.note div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--mute)}
h2{font:900 17px/1.3 "Noto Sans KR",sans-serif;margin:22px 0 10px;letter-spacing:-.3px}
h2:first-child{margin-top:4px}
h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:0;border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 140px}
.mute{color:var(--mute);font-size:14px}
.btn{min-height:44px;border-radius:12px;border:1px solid light-dark(#dfe3ea,#2a3650);background:var(--soft);padding:0 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.blue{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.ghost{background:transparent}
.btn.warn{color:var(--no)}
.btn.armed{background:var(--no);border-color:var(--no);color:#fff}
.btn.big{min-height:56px;font-size:18px;flex:1 1 0}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text],input[type=date],input[type=number],select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;min-height:40px;min-width:52px;padding:0 10px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button:disabled{opacity:.35;cursor:not-allowed}.seg .on.yes{background:var(--yes);color:#fff}.seg .on.no{background:var(--no);color:#fff}.seg .on.hold{background:var(--hold);color:#1a1200}
.myvote .btn.on.yes{background:var(--yes);border-color:var(--yes);color:#fff}
.myvote .btn.on.no{background:var(--no);border-color:var(--no);color:#fff}
.myvote .btn.on.hold{background:var(--hold);border-color:var(--hold);color:#1a1200}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list li:first-child{border-top:0}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.counts div{background:var(--soft);border-radius:10px;padding:8px 4px}
.counts b{display:block;font:700 28px/1 "Barlow Condensed",sans-serif}
.counts span{font-size:13px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 3px;background:var(--soft);font-size:14px;border:1px solid var(--line);cursor:pointer;min-height:34px}
.chip.g{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--tc);border:1px solid rgba(0,0,0,.25);flex:none}
.team{box-shadow:inset 0 5px 0 var(--tc)}
.team h3{display:flex;justify-content:space-between}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
.t-pro{background:#ff6a13;color:#fff}.t-semi{background:#2a6cff;color:#fff}.t-ama{background:#0f9d8a;color:#fff}.t-beg{background:#8a93a6;color:#fff}.t-none{background:var(--soft);color:var(--mute);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
.board{background:#0f1b33;color:#fff;border-radius:18px;padding:18px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;box-shadow:inset 0 0 0 3px #1a2c57}
.side{text-align:center}
.side .nm{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.side .sc{font:700 clamp(64px,18vw,104px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.clock{font:700 clamp(30px,8vw,44px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;background:#000;color:#ffb37f;border-radius:10px;padding:8px 12px;text-align:center}
.clock small{display:block;font:500 12px/1.4 "Noto Sans KR",sans-serif;color:#9fb0d6}
.clock.over{color:#ff4d4d}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 120px}
.goalbtn{background:var(--tc);border-color:var(--tc);color:var(--tx);font-weight:700}
.ev{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ev .min{font:700 18px "Barlow Condensed",sans-serif;width:38px;flex:none;color:var(--acc)}
.res{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.res .s{font:700 34px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.res .w{color:var(--acc)}
.mvp{margin-top:8px;font-size:14px;background:var(--soft);border-radius:8px;padding:8px 10px}
.mvp b{color:var(--acc)}
.rank li{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;gap:10px;align-items:center}
.rank .no{font:700 24px "Barlow Condensed",sans-serif;color:var(--mute);text-align:center}
.rank .top3 .no{color:var(--acc)}
.rank .v{font:700 26px/1 "Barlow Condensed",sans-serif;text-align:right;white-space:nowrap}
.rank .sub{font-size:13px;color:var(--mute)}
.sorts{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.sorts button{flex:none}
.sorts .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:28px 14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{border:0;background:none;min-height:60px;font-size:13px;cursor:pointer;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs .on{color:var(--ink);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pick .btn{text-align:left}
.rate{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rate input{grid-column:1/-1;width:100%;accent-color:var(--acc);height:32px}
.rate output{font:700 24px "Barlow Condensed",sans-serif;text-align:right;color:var(--acc)}
.gated .tabs,.gated #meBtn{display:none}
.gate h2{font-size:22px}
.tabs{display:flex!important}.tabs button{flex:1 1 0;min-width:0;padding:0}
.tabs button{position:relative}.tabs button.dot::after{content:"";position:absolute;top:9px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--no)}.tabs:not(.mgr) [data-tab=members]{display:none}
.gate{max-width:460px;margin:24px auto;text-align:center;padding:24px 18px}
.gate p{color:var(--mute)}
.google{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;background:#fff;color:#1f1f1f;border:1px solid #747775;font-weight:600;font-size:16px;margin-top:6px}
.google svg{width:20px;height:20px}
.warnbox{background:#fff4e5;color:#5a3200;border-radius:10px;padding:12px;margin:12px 0;text-align:left;font-size:14px}
.warnbox .btn{margin-top:8px;width:100%}
.err{color:var(--no)!important;font-size:14px}
.linkbtn{background:none;border:0;color:var(--acc);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px;font-size:14px}
.req{background:var(--soft);border-radius:10px;padding:10px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.clock.run{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(21,112,255,.3)}}}
@media(max-width:600px){table{font-size:13px}.tabs button{font-size:12px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><img class="logo" src="logo.png" alt="" width="36" height="36">
  <div><h1 id="teamTitle">우리 풋살팀</h1><p id="subTitle">불러오는 중…</p></div></div>
  <button class="me" id="meBtn" type="button" aria-label="내 계정"></button>
</div></header>
<div class="note" id="note"></div>
<main id="app"><div class="empty mute">데이터를 불러오는 중이에요…</div></main>
<nav class="tabs" id="tabs">
  <button data-tab="vote" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg>투표</button>
  <button data-tab="match" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg>경기</button>
  <button data-tab="rank" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V12M10 20V6M16 20v-9M22 20H2"/></svg>랭킹</button>
  <button data-tab="my" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>MY</button>
  <button data-tab="members" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 3-5 6-5s6 2 6 5M12 20c0-3 2-5 4-5s6 2 6 5"/></svg>멤버</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>

function radarSvg(val,team){const cx=150,cy=128,R=92;const pt=(i,v)=>{const a=(-90+72*i)*Math.PI/180;return[cx+R*v/100*Math.cos(a),cy+R*v/100*Math.sin(a)]};

function computeStats(){
  const done=S.matches.filter(m=>m.status==='done');
  const st={};const get=id=>st[id]=st[id]||{g:0,a:0,w:0,d:0,l:0,mvp:0,hist:[],played:0};
  done.forEach(m=>{const sc=score(m);
    (m.events||[]).forEach(e=>{if(!e.og&&e.scorer)get(e.scorer).g++;if(e.assist)get(e.assist).a++});
    for(const s of['a','b']){const o=s==='a'?'b':'a';m[s].members.forEach(pid=>{const p=get(pid);p.played++;
      if(sc[s]>sc[o])p.w++;else if(sc[s]<sc[o])p.l++;else p.d++})}});
  weeks().forEach(w=>{const R=dayRatings(w.id);if(!R.raters)return;

function tick(){document.querySelectorAll('[data-clock]').forEach(el=>{const m=S.matches.find(x=>x.id===el.dataset.clock);if(!m)return;

  endMatch:b=>{if(!arm(b.dataset.k))return;const m=liveMatch();if(!m)return;const sc=score(m);
    save('matches',{...m,status:'done',endedAt:Date.now(),pausedAt:m.pausedAt||Date.now(),scoreA:sc.a,scoreB:sc.b});toast('경기 종료! 오늘 경기가 다 끝나면 MY 탭에서 평가해 주세요')},
  delMatch:b=>{if(!arm(b.dataset.k))return;const id=b.dataset.k.split(':')[1];S.ratings.filter(r=>r.match===id).forEach(r=>remove('ratings',r.id));remove('matches',id)},
  goal:b=>{const m=liveMatch();if(m)openSheet({type:'goal',mid:m.id,side:b.dataset.s,step:'scorer'})},
  gScorer:b=>{sh.scorer=b.dataset.pid;sh.step='assist';drawSheet()},
  gAssist:b=>addEvent({scorer:sh.scorer,assist:b.dataset.pid||null,og:false}),
  gOg:b=>addEvent({scorer:b.dataset.pid,assist:null,og:true}),
  rmEv:b=>{const m=liveMatch();if(m)save('matches',{...m,events:(m.events||[]).filter(e=>e.id!==b.dataset.id)})},
  rateOpen:b=>{const wid=b.dataset.id;const ex=S.ratings.find(r=>r.id===wid+'__'+me&&r.day);const draft={};
    {const w=S.weeks.find(x=>x.id===wid);if(w)dayPeople(w).forEach(pid=>{if(pid!==me&&!isGuest(pid))draft[pid]=ex?.scores?.[pid]??5})}
    const best={};ATTRS.forEach(([k])=>best[k]=Array.isArray(ex?.best?.[k])?ex.best[k].filter(p=>p in draft).slice(0,2):[]);
    const cmts={};if(ex&&ex.comments&&typeof ex.comments==='object')for(const pid in ex.comments)if(pid in draft)cmts[pid]=String(ex.comments[pid]).slice(0,100);
    openSheet({type:'rate',wid,draft,best,cmts,step:0})},
  rateStep:b=>{sh.step=Math.max(0,Math.min(6,sh.step+(+b.dataset.d)));drawSheet();panel.scrollTop=0},
  bestPick:b=>{const k=ATTRS[sh.step-1][0],pid=b.dataset.pid;const cur=(sh.best[k]||[]).slice();const i=cur.indexOf(pid);if(i>=0)cur.splice(i,1);else{if(cur.length>=2)cur.shift();cur.push(pid)}sh.best[k]=cur;drawSheet()},
  cmtPick:b=>{const pid=b.dataset.pid;if(pid in sh.cmts)delete sh.cmts[pid];else sh.cmts[pid]='';drawSheet();if(pid in sh.cmts){const t=panel.querySelector(`textarea[data-cpid="${CSS.escape(pid)}"]`);if(t)t.focus()}},
  rateSave:()=>{const wid=sh.wid;const comments={};for(const pid in sh.cmts){const t=String(sh.cmts[pid]||'').trim().slice(0,100);if(t)comments[pid]=t}
    save('ratings',{id:wid+'__'+me,match:wid,week:wid,day:true,rater:me,scores:{...sh.draft},best:sh.best,comments,at:Date.now()});closeSheet();toast('평가를 저장했어요')},
  lookOpen:()=>{const mp=P(me);if(!mp)return;openSheet({type:'look',kit:'home',look:{...baseLook(mp.name),...cleanLook(mp.look)}})},
  lookSet:b=>{let v;try{v=JSON.parse(b.dataset.v)}catch(e){return}sh.look={...sh.look,[b.dataset.k]:v};drawSheet()},
  lookKit:b=>{sh.kit=b.dataset.v;drawSheet()},
  lookRandom:()=>{const R=n=>Math.floor(Math.random()*n);sh.look={skin:R(5),hair:R(6),hairColor:HAIR_COLORS[R(6)],bg:BG_COLORS[R(6)],eye:R(3),mouth:R(4),brow:R(3),blush:Math.random()<.6};drawSheet()},
  lookReset:()=>{sh.look=baseLook(P(me).name);drawSheet()},
  lookSave:()=>{const p=P(me);if(!p)return;save('players',{...p,look:cleanLook(sh.look)});closeSheet();toast('캐릭터를 저장했어요')},
  sort:b=>{ui.sort=b.dataset.k;render()},
  saveTeam:()=>{save('settings',{...teamDoc(),name:$('#teamName').value.trim()||'우리 풋살팀'});toast('팀 이름을 저장했어요')},
  addPlayer:()=>{const n=$('#newName').value.trim();if(!n)return toast('이름을 입력해 주세요');if(S.players.some(p=>p.name===n))return toast('같은 이름이 이미 있어요');$('#newName').value='';save('players',{id:'p'+newId(),name:n,createdAt:Date.now()})},
  toggleMgr:b=>{const p=P(b.dataset.pid);if(!p||!p.uid)return toast('구글 계정이 연결된 멤버만 매니저가 될 수 있어요');if(p.uid===presUid())return;const ms=mgrUids();
    save('settings',{...teamDoc(),managerUids:ms.includes(p.uid)?ms.filter(x=>x!==p.uid):[...ms,p.uid]});toast(p.name+(ms.includes(p.uid)?'님 매니저 해제':'님을 매니저로 지정했어요'))},
  claimPres:()=>{if(presUid())return;save('settings',{...teamDoc(),presidentUid:authUser.uid});toast('회장으로 등록했어요')},
  checkUpdate:()=>checkUpdate(true),
  doUpdate,
  delPlayer:b=>{if(!arm(b.dataset.k))return;const id=b.dataset.k.split(':')[1];const p=P(id);if(p&&p.uid){if(!dropMgr(p.uid))return;remove('users',p.uid)}remove('players',id)}
};
/* ---------- 드래그 앤 드롭 (마우스: 바로, 터치: 꾹 누른 뒤) ---------- */
function moveTargets(ctx){
  if(ctx==='teams'){const w=curWeek();return[...(w.teams||[]).map((t,i)=>({zone:'t'+i,label:t.name+'으로 이동'})),{zone:'pool',label:'팀에서 빼기 (미배치)'},{zone:'absent',label:'불참 처리'}]}
  const m=liveMatch();return m?[{zone:'a',label:m.a.name+' (출전)'},{zone:'b',label:m.b.name+' (출전)'},{zone:'bench',label:'벤치 · 대기'}]:[]}
function onDrop(ctx,pid,from,to){
  if(!isMgr()||from===to)return;
  if(ctx==='teams'){const w=curWeek();if(!w)return;const teams=(w.teams||[]).map(t=>({...t,members:t.members.filter(p=>p!==pid)}));
    if(to==='absent'){if(isGuest(pid)){save('weeks',{...w,teams,guests:(w.guests||[]).filter(g=>g.id!==pid)});toast(nameOf(pid)+' 용병 삭제')}
      else{save('weeks',{...w,teams});save('votes',{id:w.id+'__'+pid,week:w.id,pid,status:'no',at:Date.now()});toast(nameOf(pid)+' 불참 처리')}return}
    if(to.startsWith('t')){const i=+to.slice(1);if(!teams[i])return;teams[i].members.push(pid)}
    save('weeks',{...w,teams});toast(nameOf(pid)+' → '+(to==='pool'?'미배치':teams[+to.slice(1)].name))}
  else if(ctx==='match'){const m=liveMatch();if(!m)return;const a={...m.a,members:m.a.members.filter(p=>p!==pid)},b={...m.b,members:m.b.members.filter(p=>p!==pid)};
    if(to==='a')a.members.push(pid);if(to==='b')b.members.push(pid);
    save('matches',{...m,a,b});toast(nameOf(pid)+' → '+(to==='bench'?'벤치':(to==='a'?a:b).name))}
}
let drag=null;
function startDrag(x,y){if(!drag)return;drag.active=true;const g=drag.el.cloneNode(true);g.classList.add('drag-ghost');g.removeAttribute('data-drag');document.body.appendChild(g);
  drag.ghost=g;drag.el.classList.add('dragging');try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}moveGhost(x,y)}
function moveGhost(x,y){drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px';
  const t=document.elementFromPoint(x,y)?.closest('[data-drop]');document.querySelectorAll('.dz.over').forEach(z=>{if(z!==t)z.classList.remove('over')});if(t)t.classList.add('over');drag.over=t;
  if(y<80)scrollBy(0,-14);else if(y>innerHeight-110)scrollBy(0,14)}
function endDrag(cancel){if(!drag)return;clearTimeout(drag.timer);const d=drag;drag=null;if(!d.active)return;
  d.ghost.remove();d.el.classList.remove('dragging');document.querySelectorAll('.dz.over').forEach(z=>z.classList.remove('over'));ui.justDragged=Date.now();
  const to=d.over&&d.over.dataset.drop;if(!cancel&&to&&to!==d.from)onDrop(d.ctx,d.pid,d.from,to)}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-drag]');if(!el||e.button>0||!isMgr())return;
  drag={el,pid:el.dataset.pid,from:el.dataset.from,ctx:el.dataset.drag,x:e.clientX,y:e.clientY,active:false,id:e.pointerId,touch:e.pointerType!=='mouse'};
  if(drag.touch)drag.timer=setTimeout(()=>startDrag(drag.x,drag.y),230)});
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){if(drag.touch){clearTimeout(drag.timer);drag=null;return}startDrag(e.clientX,e.clientY)}return}
  e.preventDefault();moveGhost(e.clientX,e.clientY)},{passive:false});
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault()},{passive:false});
document.addEventListener('pointerup',()=>endDrag(false));document.addEventListener('pointercancel',()=>endDrag(true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-drag]'))e.preventDefault()});
function dropMgr(u){if(u===presUid()){toast('회장은 연결 해제하거나 삭제할 수 없어요');return false}const ms=mgrUids();if(!ms.includes(u))return true;if(!isPres()){toast('매니저는 회장만 바꿀 수 있어요');return false}save('settings',{...teamDoc(),managerUids:ms.filter(x=>x!==u)});return true}
function addEvent(x){const side=sh.side;const m=S.matches.find(y=>y.id===sh.mid);closeSheet();if(!m||m.status!=='live')return;
  save('matches',{...m,events:[...(m.events||[]),{id:'e'+newId(),team:side,sec:Math.floor(elapsed(m)),...x}]});toast(x.og?'자책골 기록':'골 기록: '+nameOf(x.scorer))}
const MGR_ACTS=new Set(['toggleDraw','dragPick','moveTo','toggleNewWeek','createWeek','delWeek','addGuest','rmGuest','tc','draw','move','start','pause','endMatch','delMatch','goal','gScorer','gAssist','gOg','rmEv','saveTeam','unlink','delPlayer']);
function onClick(e){const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act;
  if(MGR_ACTS.has(act)&&!isMgr())return toast(MGR_ONLY);if((act==='toggleMgr'||act==='claimPres')&&!(act==='claimPres'?isMgr():isPres()))return toast('회장만 할 수 있어요');
  const f=A[act];if(f)f(b)}
document.addEventListener('click',e=>{if(e.target.closest('#tabs')){const b=e.target.closest('[data-tab]');if(b)A.go(b);return}if(e.target.closest('#meBtn'))return A.pickMe();if(e.target.closest('#app,#panel,#note'))onClick(e)});
document.addEventListener('toggle',e=>{if(e.target.id==='teamsDet')ui.openTeams=e.target.open},true);
document.addEventListener('change',e=>{if(e.target.id==='weekSel'){ui.week=e.target.value;render()}if(e.target.id==='balance')ui.balance=e.target.checked});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const m={guestName:isMgr()?'addGuest':null,teamName:isMgr()?'saveTeam':null,joinName:gate==='bootstrap'?'bootstrap':'join'}[e.target.id];if(m)A[m]()}if(e.key==='Escape')closeSheet()});

/* ---------- auth & boot ---------- */
const baseUnsubs=[],dataUnsubs=[];let reqUnsub=null,dataTimer=null,preUnsub=null;
const off=arr=>{arr.forEach(u=>{try{u()}catch(e){}});arr.length=0};
function startData(){
  dataTimer=setTimeout(()=>{if(loaded.size<DATA_COLS.length){slowNote='데이터를 아직 불러오지 못했어요. 표시된 내용이 최신이 아닐 수 있어요.';render()}},10000);
  DATA_COLS.forEach(c=>dataUnsubs.push(store.sub(c,(rows,meta)=>{S[c]=rows;if(!meta||!meta.fromCache)loaded.add(c);if(loaded.size===DATA_COLS.length){clearTimeout(dataTimer);slowNote=''}
    if(!sh||sh.type!=='rate')drawSheet();render()},err=>{clearTimeout(dataTimer);slowNote=err&&err.code==='permission-denied'?'접근 권한이 없어요. 매니저에게 문의해 주세요.':'데이터 연결이 끊겼어요. 앱을 다시 열어 주세요.';render()})));
}
function computeGate(){
  if(!fb)return;
  if(!authUser)gate='login';
  else if(!S.teamLoaded||!S.userLoaded)gate='loading';
  else if(S.myUser)gate='app';
  else if(!mgrUids().length)gate='bootstrap';
  else gate='join';
  me=S.myUser?.pid||null;
  if(gate==='app'&&!dataUnsubs.length){if(preUnsub){preUnsub();preUnsub=null}startData()}
  if(gate!=='app'&&dataUnsubs.length){off(dataUnsubs);clearTimeout(dataTimer);DATA_COLS.forEach(c=>S[c]=[]);loaded.clear()}
  if((gate==='join'||gate==='bootstrap')&&!preUnsub)preUnsub=store.sub('players',rows=>{S.players=rows},()=>{});
  if(gate!=='join'&&gate!=='bootstrap'&&preUnsub){preUnsub();preUnsub=null}
}
async function joinTeam(asMgr){
  const n=($('#joinName')?.value||'').trim();if(!n)return toast('이름을 입력해 주세요');
  const u=authUser;if(S.players.some(p=>p.name===n&&p.uid&&p.uid!==u.uid))return toast('이미 다른 사람이 쓰는 이름이에요');
  ui.joining=true;render();
  try{
    if(asMgr){const t=teamDoc();await store.set('settings','team',{name:t.name||'우리 풋살팀',managerUids:[u.uid],presidentUid:u.uid})}
    const ex=S.players.find(p=>p.name===n&&!p.uid);const pid=ex?ex.id:'p'+newId();
    const body=ex?(({id,...d})=>({...d,uid:u.uid}))(ex):{name:n,uid:u.uid,createdAt:Date.now()};
    await store.set('players',pid,JSON.parse(JSON.stringify(body)));
    await store.set('users',u.uid,{pid,name:n,email:u.email||'',joinedAt:Date.now()});
    toast(n+'님, 환영해요!');
  }catch(e){toast('가입하지 못했어요 ('+(e&&e.code||'오류')+')')}
  ui.joining=false;render();
}
render();
(async()=>{
  if(inKakao){try{location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)}catch(e){}}
  try{fb=await loadFirebase()}catch(e){gate='error';gateErr='서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.';render();return}
  try{await fb.auth.getRedirectResult(fb.A)}catch(e){ui.loginErr=loginMsg(e)}
  fb.auth.onAuthStateChanged(fb.A,u=>{
    authUser=u;off(baseUnsubs);off(dataUnsubs);clearTimeout(dataTimer);if(preUnsub){preUnsub();preUnsub=null}closeSheet();
    Object.assign(S,{settings:[],myUser:null,users:[],teamLoaded:false,userLoaded:false});DATA_COLS.forEach(c=>S[c]=[]);loaded.clear();slowNote='';
    if(u){const fail=e=>{gate='error';gateErr='정보를 읽지 못했어요 ('+(e&&e.code||'오류')+'). 잠시 후 다시 시도해 주세요.';render()};
      baseUnsubs.push(store.subDoc('settings','team',d=>{S.settings=d?[d]:[];S.teamLoaded=true;computeGate();render()},fail));
      baseUnsubs.push(store.subDoc('users',u.uid,d=>{S.myUser=d;S.userLoaded=true;computeGate();render()},fail));}
    computeGate();render();
  });
})();
}
